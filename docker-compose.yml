services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-social_buzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-social_buzz}
      POSTGRES_DB: ${POSTGRES_DB:-thesocialbuzz}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs once, only on first init (empty data dir), and creates the
      # schema + seed rows (admin/admin123, sample posts & projects).
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      # Exposes Postgres on the host so tools like DBeaver/pgAdmin can
      # connect to localhost:5432. Remove this in production — the app
      # container reaches the db over the internal Docker network and
      # doesn't need this exposed.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-social_buzz} -d ${POSTGRES_DB:-thesocialbuzz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-social_buzz}:${POSTGRES_PASSWORD:-social_buzz}@db:5432/${POSTGRES_DB:-thesocialbuzz}?sslmode=disable
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET in your .env file}
    ports:
      - "3000:3000"
    volumes:
      # Persist uploaded thumbnails outside the container so they survive
      # rebuilds/redeploys.
      - uploads_data:/app/public/uploads

volumes:
  db_data:
  uploads_data:
